openapi: 3.1.0
info:
  title: SEP HRMS API
  version: '1.0'
  description: Human Resource Management System API for Sarie Eldin & Partners Legal Advisors

servers:
  - url: '/api'
    description: API base URL

security:
  - bearerAuth: []
  - apiKeyAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Use your Sanctum token
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for ZKTeco device integration

  schemas:
    Employee:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        arabic_name:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, inactive, terminated, on_leave]
        department_id:
          type: integer
        position_id:
          type: integer
        manager_id:
          type: integer
        national_id:
          type: string
        photo_path:
          type: string
      required:
        - code
        - first_name
        - last_name
        - status
        - department_id
        - position_id

    AttendanceRecord:
      type: object
      properties:
        employee_code:
          type: string
        timestamp:
          type: string
          format: date-time
        device_id:
          type: string
        type:
          type: string
          enum: [in, out]
        signature:
          type: string

    AttendanceStats:
      type: object
      properties:
        total_records:
          type: integer
        today_attendance:
          type: integer
        present_employees:
          type: integer
        absent_employees:
          type: integer

    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object

paths:
  /attendance/push:
    post:
      summary: Push attendance record from ZKTeco device
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceRecord'
      responses:
        '200':
          description: Successfully recorded attendance
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid API key

  /attendance/health:
    get:
      summary: Check attendance system health
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: System is healthy
        '401':
          description: Invalid API key

  /attendance/stats:
    get:
      summary: Get attendance statistics
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Attendance statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceStats'
        '401':
          description: Invalid API key

  /attendance/employees:
    get:
      summary: Get list of active employees for attendance system
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Employee list retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
        '401':
          description: Invalid API key

  /attendance/batch-calculate:
    post:
      summary: Batch calculate attendance summaries
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
      responses:
        '200':
          description: Batch calculation completed
        '401':
          description: Unauthorized
        '403':
          description: Insufficient permissions

  /attendance/report:
    get:
      summary: Get attendance report
      security:
        - bearerAuth: []
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: department_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Report generated successfully
        '401':
          description: Unauthorized
        '403':
          description: Insufficient permissions

  /attendance/adjust:
    post:
      summary: Adjust attendance record
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                record_id:
                  type: integer
                adjustment_type:
                  type: string
                  enum: [correction, addition]
                reason:
                  type: string
      responses:
        '200':
          description: Adjustment recorded successfully
        '401':
          description: Unauthorized
        '403':
          description: Insufficient permissions